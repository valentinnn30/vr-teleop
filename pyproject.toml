[project]
name = "vr-teleop"
version = "0.1.0"
description = "VR teleoperation stack (Quest bridge, retargeting, data collection, hand control) for the G1 + BrainCo hands project. Talks to a GR00T repo's SONIC deploy process over ZMQ; does not contain body-control or sim code."
requires-python = ">=3.10"

# NOTE: `gear_sonic` is deliberately NOT listed here.
#
# The teleop manager imports it for the robot's kinematic chain (FK during
# calibration), but it lives in a separate GR00T-WholeBodyControl checkout whose
# path differs per machine. PEP 508 URL dependencies cannot interpolate
# environment variables, so a `file:///...` entry here would be correct on
# exactly one host — it was previously hardcoded to a laptop home directory and
# could never have installed on the robot.
#
# install_scripts/install_teleop.sh installs it explicitly from $GROOT_REPO
# instead, which is the same variable scripts/launch_robot_side.sh uses. See
# CLAUDE.md for the boundary.
dependencies = [
    "numpy>=1.24,<2",
    "scipy",
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "pin",           # Pinocchio: forward kinematics for calibration
]

[project.optional-dependencies]
# Only needed if data_collection/ is kept -- delete this extra (and the directory)
# together if data collection turns out not to be needed. Note the LeRobot
# recorder also requires gear_sonic[data_collection] from the GR00T checkout, and
# currently requires a running camera server (see CLAUDE.md).
data_collection = [
    "tyro",
    "pyttsx3==2.90",
    "av>=14.2",
    "opencv-python",
    "datasets==3.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# quest_bridge/ is intentionally absent: it has no __init__.py and is not a
# package. Its scripts are run by path on the host and COPY'd into the relay
# container image, never imported.
include = ["retargeting*", "hand_control*", "teleop_manager*", "data_collection*"]
